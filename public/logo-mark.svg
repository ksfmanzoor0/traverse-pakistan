<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <clipPath id="mc">
      <circle cx="40" cy="40" r="34.5"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="40" cy="40" r="37.5" stroke="#3E7A6E" stroke-width="2.5" fill="white"/>

  <!-- Solid brand-green sky (replaces the purple in the original) -->
  <circle cx="40" cy="40" r="34.5" fill="#3E7A6E"/>

  <!-- ===== MOUNTAIN — exact polygons from the header logo ===== -->

  <!-- Main snow face: large central peak, white -->
  <polygon points="40,11 7,67 73,67"
           fill="white" clip-path="url(#mc)"/>

  <!-- Right-side shadow face (darker teal) -->
  <polygon points="40,11 52,30 66,56 73,67 53,67"
           fill="#2C5C52" clip-path="url(#mc)" opacity="0.82"/>

  <!-- Central crevice / rock shadow (darker teal, narrow) -->
  <polygon points="40,11 37,22 38,34 42,50 45,67 40,67 37,48 36,32 38,20"
           fill="#2C5C52" clip-path="url(#mc)" opacity="0.9"/>

  <!-- Rock face block centre-lower -->
  <polygon points="34,67 38,50 43,51 46,67"
           fill="#2C5C52" clip-path="url(#mc)" opacity="0.75"/>

  <!-- Rock outcrop lower-left -->
  <polygon points="7,67 16,52 24,60 22,67"
           fill="#2C5C52" clip-path="url(#mc)" opacity="0.65"/>

  <!-- Rock outcrop lower-right -->
  <polygon points="57,67 60,53 68,60 73,67"
           fill="#2C5C52" clip-path="url(#mc)" opacity="0.55"/>

  <!-- Snow ground field at base -->
  <rect x="0" y="63" width="80" height="12" fill="white" clip-path="url(#mc)"/>
</svg>
